#:schema https://mise.jdx.dev/schema/mise.json

[tools]
cosign = "3.1.4"
go = "1.27.4"
golangci-lint = "2.15.0"
goreleaser = "2.20.1"
hugo-extended = "0.169.0"
node = "26"
prek = "0.5.10"
task = "3.54.0"

"github:cloudsmith-io/cloudsmith-cli" = "1.31.0"

[env]
REDIRECTS_LOG_LEVEL = "debug"
REDIRECTS_LOG_PRETTY = "true"
REDIRECTS_LOG_COLOR = "true"

REDIRECTS_SERVER_TEMPLATES = "pkg/templates/dist/"
